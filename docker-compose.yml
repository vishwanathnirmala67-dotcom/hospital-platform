# Local full stack: docker compose up --build   ->  UI http://localhost:5173  API http://localhost:4000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hospital
      JWT_ACCESS_SECRET: local-dev-secret-local-dev-secret-0123456789
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /data/uploads
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    volumes: [uploads:/data/uploads]
  web:
    image: node:20-alpine
    working_dir: /app
    volumes: [./frontend:/app]
    command: sh -c "npm install && npm run dev -- --host"
    environment: { VITE_API_URL: "http://localhost:4000" }
    ports: ["5173:5173"]
volumes: { pgdata: {}, uploads: {} }
