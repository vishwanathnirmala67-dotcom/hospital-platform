# Render Blueprint: New > Blueprint > pick this repo. Secrets are generated by Render, never stored in git.
databases:
  - name: hospital-db
    plan: free
    databaseName: hospital
services:
  - type: web
    name: hospital-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev --no-audit
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: hospital-db, property: connectionString } }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: CORS_ORIGIN, sync: false }        # set to your Vercel URL
      - { key: UPLOAD_DIR, value: /var/data/uploads }
      - { key: SMTP_URL, sync: false }
